<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>录音机 v1.7.1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- lamejs CDN for MP3 Encoding -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        /* Glassmorphism base style */
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Animated glowing border effect */
        .glow-effect {
            position: relative;
        }
        .glow-effect::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899, #3b82f6);
            border-radius: 1rem;
            z-index: -1;
            opacity: 0.3;
            filter: blur(8px);
            transition: opacity 0.3s ease;
        }
        .glow-effect:hover::before {
            opacity: 0.6;
        }

        /* Custom dropdown styles */
        .custom-select {
            position: relative;
            user-select: none;
        }
        .select-trigger {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .select-trigger:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }
        .select-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            max-height: 200px;
            overflow-y: auto;
        }
        .custom-select.open .select-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .select-option {
            padding: 0.6rem 1rem;
            cursor: pointer;
            transition: background 0.15s ease;
            font-size: 0.875rem;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .select-option:hover {
            background: rgba(59, 130, 246, 0.15);
            color: #f8fafc;
        }
        .select-option.selected {
            background: rgba(59, 130, 246, 0.25);
            color: #60a5fa;
            font-weight: 500;
        }

        /* Form control disabled overlay state */
        .form-control-disabled {
            opacity: 0.5;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* Custom Scrollbar for Dropdown */
        .select-dropdown::-webkit-scrollbar {
            width: 5px;
        }
        .select-dropdown::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        .select-dropdown::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Custom pulse animation for recording status */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-6">

    <main class="w-full max-w-xl glass-card rounded-2xl glow-effect p-6 md:p-8 flex flex-col gap-6">
        
        <!-- Header Section -->
        <header class="flex items-center justify-between border-b border-slate-700/50 pb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center border border-blue-500/30">
                    <i class="fa-solid fa-microphone-lines text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-100 tracking-tight">录音机</h1>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Version Badge -->
                <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800/80 text-slate-400 border border-slate-700/60">v1.7.1</span>
                <!-- Status Badge -->
                <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-slate-500" id="statusDot"></span>
                    <span id="statusText">就绪</span>
                </div>
            </div>
        </header>

        <!-- Toast Alert Box -->
        <div id="toastMsg" class="empty:hidden px-4 py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs flex items-center gap-2 transition-all">
        </div>

        <!-- Controls Form Panel -->
        <section class="flex flex-col gap-4">
            <!-- File Name Input -->
            <div class="flex flex-col gap-1.5">
                <label for="recordName" class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square text-slate-400"></i> 录音文件名
                </label>
                <input type="text" id="recordName" value="语音录音" placeholder="请输入文件名..." 
                    class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/60 border border-slate-700/60 text-sm text-slate-100 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-500 disabled:opacity-50 disabled:cursor-not-allowed">
            </div>

            <!-- Microphone & Bitrate Selection: 固定双列并排 -->
            <div class="grid grid-cols-2 gap-3 md:gap-4">
                <!-- Microphone Selection -->
                <div class="flex flex-col gap-1.5 min-w-0">
                    <label class="text-xs font-medium text-slate-300 flex items-center gap-1.5 truncate">
                        <i class="fa-solid fa-microphone text-slate-400"></i> 输入设备
                    </label>
                    <div class="custom-select" id="customMicSelect">
                        <button type="button" class="select-trigger w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-200 flex items-center justify-between text-left" id="micTrigger">
                            <span class="truncate" id="micTriggerText">正在检测设备...</span>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-xs ml-1 flex-shrink-0"></i>
                        </button>
                        <div class="select-dropdown" id="micDropdown"></div>
                    </div>
                </div>

                <!-- Bitrate Selection -->
                <div class="flex flex-col gap-1.5 min-w-0">
                    <label class="text-xs font-medium text-slate-300 flex items-center gap-1.5 truncate">
                        <i class="fa-solid fa-sliders text-slate-400"></i> 编码比特率
                    </label>
                    <div class="custom-select" id="customBitrateSelect">
                        <button type="button" class="select-trigger w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-200 flex items-center justify-between text-left" id="bitrateTrigger">
                            <span class="truncate" id="bitrateTriggerText">16 kbps (低占用/清晰语音)</span>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-xs ml-1 flex-shrink-0"></i>
                        </button>
                        <div class="select-dropdown" id="bitrateDropdown">
                            <div class="select-option selected" data-value="16">16 kbps (低占用/清晰语音)</div>
                            <div class="select-option" data-value="32">32 kbps (标准语音)</div>
                            <div class="select-option" data-value="64">64 kbps (高品质语音)</div>
                            <div class="select-option" data-value="128">128 kbps (高保真)</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Audio Visualizer Canvas & Timer Segment -->
        <section class="flex flex-col items-center justify-center bg-slate-900/80 rounded-xl p-4 md:p-5 border border-slate-800 gap-3">
            <!-- Timer Display -->
            <div class="text-4xl md:text-5xl font-mono font-bold tracking-wider text-slate-100 drop-shadow-md" id="timerDisplay">
                00:00:00
            </div>

            <!-- Equalizer Visualizer Canvas (高度缩小 50%：h-28 -> h-14) -->
            <div class="w-full h-14 relative flex items-center justify-center">
                <canvas id="canvas" class="w-full h-full block"></canvas>
            </div>
        </section>

        <!-- Control Action Buttons -->
        <section class="flex items-center justify-center gap-4 py-2">
            <!-- Start Button -->
            <button id="btnStart" class="px-6 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium text-sm flex items-center gap-2 shadow-lg shadow-blue-600/30 transition-all">
                <i class="fa-solid fa-circle text-xs text-red-400"></i> 开始录音
            </button>

            <!-- Pause Button -->
            <button id="btnPause" style="display: none;" class="px-6 py-3.5 rounded-xl bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white font-medium text-sm flex items-center gap-2 shadow-lg shadow-amber-600/30 transition-all">
                <i class="fa-solid fa-pause"></i> 暂停录音
            </button>

            <!-- Resume Button -->
            <button id="btnResume" style="display: none;" class="px-6 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-medium text-sm flex items-center gap-2 shadow-lg shadow-emerald-600/30 transition-all">
                <i class="fa-solid fa-play"></i> 继续录音
            </button>

            <!-- Stop Button -->
            <button id="btnStop" style="display: none;" class="px-6 py-3.5 rounded-xl bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-medium text-sm flex items-center gap-2 shadow-lg shadow-rose-600/30 transition-all">
                <i class="fa-solid fa-square"></i> 停止录制
            </button>

            <!-- Download Button (Post Finished) -->
            <button id="btnDownloadManual" style="display: none;" class="px-6 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm flex items-center gap-2 shadow-lg shadow-indigo-600/30 transition-all">
                <i class="fa-solid fa-download"></i> 下载 MP3
            </button>
        </section>

        <!-- Bottom Preview Audio Player Container -->
        <section id="playerContainer" style="display: none;" class="flex flex-col gap-2 pt-2 border-t border-slate-700/50">
            <span class="text-xs text-slate-400 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-emerald-400"></i> 录音完成，可直接预览播放：
            </span>
            <audio id="audioPreview" controls class="w-full h-10 rounded-lg accent-blue-500 bg-slate-900"></audio>
        </section>

    </main>

    <script>
        // State Machine constants
        const STATE = {
            IDLE: 'idle',
            RECORDING: 'recording',
            PAUSED: 'paused',
            ENCODING: 'encoding',
            FINISHED: 'finished'
        };

        let currentState = STATE.IDLE;
        
        let audioCtx = null;
        let currentStream = null;
        let activeDeviceId = null; 
        let sourceNode = null;
        let analyserNode = null;
        let workletNode = null; 

        // Real-time MP3 encoding states
        let mp3Encoder = null;
        let mp3Chunks = [];
        let pcmBuffer = new Int16Array(0); // Holds leftover PCM frames for fixed-size encoding

        let recordStartTime = null;
        let totalRecordedMs = 0;
        let lastTimerTick = 0;
        let timerInterval = null;
        let currentDownloadUrl = null;
        let currentFileName = '';
        let selectedBitrateVal = "16";
        const TARGET_SAMPLE_RATE = 16000;

        const CANVAS_BARS = 28;
        const CANVAS_SEGS = 8;
        let barHeights = new Float32Array(CANVAS_BARS).fill(0);
        const globalFreqData = new Uint8Array(128); 

        // DOM Elements
        const elName = document.getElementById('recordName');
        const elTimer = document.getElementById('timerDisplay');
        const elStatusBadge = document.getElementById('statusBadge');
        const elStatusDot = document.getElementById('statusDot');
        const elStatusText = document.getElementById('statusText');
        
        const elBtnStart = document.getElementById('btnStart');
        const elBtnPause = document.getElementById('btnPause');
        const elBtnResume = document.getElementById('btnResume');
        const elBtnStop = document.getElementById('btnStop');
        const elBtnDownloadManual = document.getElementById('btnDownloadManual');

        const elToast = document.getElementById('toastMsg');
        const elPlayerContainer = document.getElementById('playerContainer');
        const elAudioPreview = document.getElementById('audioPreview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Custom Dropdown Controls
        const micCustomSelect = document.getElementById('customMicSelect');
        const micTrigger = document.getElementById('micTrigger');
        const micTriggerText = document.getElementById('micTriggerText');
        const micDropdown = document.getElementById('micDropdown');

        const bitrateCustomSelect = document.getElementById('customBitrateSelect');
        const bitrateTrigger = document.getElementById('bitrateTrigger');
        const bitrateTriggerText = document.getElementById('bitrateTriggerText');
        const bitrateDropdown = document.getElementById('bitrateDropdown');

        // Dropdown toggles
        micTrigger.addEventListener('click', (e) => {
            if (micCustomSelect.classList.contains('form-control-disabled')) return;
            e.stopPropagation();
            bitrateCustomSelect.classList.remove('open');
            micCustomSelect.classList.toggle('open');
        });

        bitrateTrigger.addEventListener('click', (e) => {
            if (bitrateCustomSelect.classList.contains('form-control-disabled')) return;
            e.stopPropagation();
            micCustomSelect.classList.remove('open');
            bitrateCustomSelect.classList.toggle('open');
        });

        window.addEventListener('click', () => {
            micCustomSelect.classList.remove('open');
            bitrateCustomSelect.classList.remove('open');
        });

        // Bitrate selection
        bitrateDropdown.querySelectorAll('.select-option').forEach(opt => {
            opt.addEventListener('click', () => {
                bitrateDropdown.querySelectorAll('.select-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedBitrateVal = opt.getAttribute('data-value');
                bitrateTriggerText.textContent = opt.textContent;
                bitrateCustomSelect.classList.remove('open');
            });
        });

        // Canvas DPI Handler
        function setupCanvasDPI() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', setupCanvasDPI);
        setupCanvasDPI();

        // Prevent accidental closing while recording
        window.addEventListener('beforeunload', (e) => {
            if (currentState === STATE.RECORDING || currentState === STATE.PAUSED) {
                e.preventDefault();
                e.returnValue = '录音正在进行中，关闭或刷新页面将导致数据丢失，确定要离开吗？';
                return e.returnValue;
            }
            releaseAudioResources();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await requestPermissionAndLoadDevices();
            setupDeviceChangeListener();
            drawVisualizer();
        });

        // Register AudioWorklet dynamically
        async function setupAudioWorklet(context) {
            const workletCode = `
                class RecorderWorklet extends AudioWorkletProcessor {
                    process(inputs, outputs, parameters) {
                        const input = inputs[0];
                        if (input && input.length > 0) {
                            const channelData = input[0];
                            const pcm16 = new Int16Array(channelData.length);
                            for (let i = 0; i < channelData.length; i++) {
                                let s = Math.max(-1, Math.min(1, channelData[i]));
                                pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                            }
                            this.port.postMessage(pcm16);
                        }
                        return true;
                    }
                }
                registerProcessor('recorder-worklet', RecorderWorklet);
            `;
            const blob = new Blob([workletCode], { type: 'application/javascript' });
            const workletUrl = URL.createObjectURL(blob);
            await context.audioWorklet.addModule(workletUrl);
        }

        async function requestPermissionAndLoadDevices() {
            showToast("");
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                tempStream.getTracks().forEach(track => track.stop());

                await new Promise(r => setTimeout(r, 100));
                await refreshMicList();
            } catch (err) {
                console.error("初始化权限失败:", err);
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showToast("⚠ 无法访问麦克风，请允许网页使用麦克风权限。");
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    showToast("⚠ 未检测到可用的麦克风设备。");
                } else {
                    showToast("⚠ 麦克风初始化失败: " + err.message);
                }
                micTriggerText.textContent = "无法获取麦克风";
            }
        }

        async function refreshMicList() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioInputs = devices.filter(d => d.kind === 'audioinput');

            micDropdown.innerHTML = '';

            if (audioInputs.length === 0) {
                activeDeviceId = null;
                micTriggerText.textContent = "未检测到麦克风";
                if (currentState === STATE.RECORDING || currentState === STATE.PAUSED) {
                    showToast("⚠ 所有麦克风已被拔出/禁用！");
                }
                return;
            }

            let defaultDevice = null;
            let activeDeviceStillExists = false;

            audioInputs.forEach((device, index) => {
                let name = device.label || (device.deviceId === 'default' ? '默认麦克风' : `麦克风输入 ${index + 1}`);

                const optDiv = document.createElement('div');
                optDiv.className = 'select-option';
                optDiv.dataset.value = device.deviceId;
                optDiv.textContent = name;
                optDiv.title = name;

                if (activeDeviceId && device.deviceId === activeDeviceId) {
                    optDiv.classList.add('selected');
                    activeDeviceStillExists = true;
                }

                if (device.deviceId === 'default') {
                    defaultDevice = device;
                }

                optDiv.addEventListener('click', async () => {
                    micDropdown.querySelectorAll('.select-option').forEach(o => o.classList.remove('selected'));
                    optDiv.classList.add('selected');
                    activeDeviceId = device.deviceId;
                    micTriggerText.textContent = name;
                    micTrigger.title = name;
                    micCustomSelect.classList.remove('open');

                    if (currentState === STATE.RECORDING || currentState === STATE.PAUSED) {
                        await switchMicStream(activeDeviceId);
                    }
                });
                
                micDropdown.appendChild(optDiv);
            });

            if (!activeDeviceId) {
                if (defaultDevice) {
                    activeDeviceId = defaultDevice.deviceId;
                    const firstOpt = micDropdown.querySelector(`[data-value="${defaultDevice.deviceId}"]`);
                    if (firstOpt) {
                        firstOpt.classList.add('selected');
                        micTriggerText.textContent = firstOpt.textContent;
                        micTrigger.title = firstOpt.textContent;
                    }
                } else {
                    const firstOpt = micDropdown.querySelector('.select-option');
                    if (firstOpt) {
                        firstOpt.classList.add('selected');
                        activeDeviceId = firstOpt.dataset.value;
                        micTriggerText.textContent = firstOpt.textContent;
                        micTrigger.title = firstOpt.textContent;
                    }
                }
            } else if (!activeDeviceStillExists) {
                activeDeviceId = null;
                micTriggerText.textContent = "⚠ 原设备已断开";
                micTrigger.title = "⚠ 原设备已断开";
                if (currentState === STATE.RECORDING || currentState === STATE.PAUSED) {
                    showToast("⚠ 当前使用中的麦克风已断开。");
                }
            }
        }

        function setupDeviceChangeListener() {
            if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
                navigator.mediaDevices.addEventListener('devicechange', async () => {
                    await refreshMicList();
                });
            }
        }

        function bindTrackEndEvent(stream) {
            if (!stream) return;
            const tracks = stream.getAudioTracks();
            if (tracks.length > 0) {
                tracks[0].onended = () => {
                    if (currentState === STATE.RECORDING || currentState === STATE.PAUSED) {
                        pauseTimer();
                        showToast("⚠ 麦克风设备已意外断开。");
                        setState(STATE.PAUSED);
                        refreshMicList();
                    }
                };
            }
        }

        async function switchMicStream(newDeviceId) {
            let newStream = null;
            try {
                const constraints = {
                    audio: {
                        deviceId: newDeviceId ? { exact: newDeviceId } : undefined,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                };

                newStream = await navigator.mediaDevices.getUserMedia(constraints);

                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                    await setupAudioWorklet(audioCtx);
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                if (!analyserNode) {
                    analyserNode = audioCtx.createAnalyser();
                    analyserNode.fftSize = 256;
                    analyserNode.smoothingTimeConstant = 0.3;
                }

                if (!workletNode) {
                    workletNode = new AudioWorkletNode(audioCtx, 'recorder-worklet');
                    workletNode.port.onmessage = (e) => {
                        if (currentState === STATE.RECORDING) {
                            processAndEncodePCM(e.data);
                        }
                    };
                }

                if (sourceNode) {
                    sourceNode.disconnect();
                    sourceNode = null;
                }

                sourceNode = audioCtx.createMediaStreamSource(newStream);
                sourceNode.connect(analyserNode);
                sourceNode.connect(workletNode);

                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                currentStream = newStream;
                activeDeviceId = newDeviceId || (newStream.getAudioTracks()[0] ? newStream.getAudioTracks()[0].getSettings().deviceId : null);
                bindTrackEndEvent(currentStream);
                showToast(""); 
                return true;

            } catch (err) {
                console.error("切换麦克风失败:", err);
                if (newStream) {
                    newStream.getTracks().forEach(track => track.stop());
                }
                showToast("⚠ 麦克风开启/切换失败。");
                return false;
            }
        }

        // Downsample and real-time encode into lamejs MP3 blocks
        function processAndEncodePCM(newPcmData) {
            if (!mp3Encoder) return;

            const sourceRate = audioCtx ? audioCtx.sampleRate : 44100;
            const ratio = sourceRate / TARGET_SAMPLE_RATE;
            
            // Downsampling to 16000Hz
            const outLength = Math.floor(newPcmData.length / ratio);
            const resampled = new Int16Array(outLength);
            for (let i = 0; i < outLength; i++) {
                resampled[i] = newPcmData[Math.floor(i * ratio)] || 0;
            }

            // Append with remaining buffer from previous frame
            const combined = new Int16Array(pcmBuffer.length + resampled.length);
            combined.set(pcmBuffer, 0);
            combined.set(resampled, pcmBuffer.length);

            // Chunk size (multiple of 1152 frames for LAME encoder)
            const chunkSize = 1152 * 5; 
            let offset = 0;
            while (offset + chunkSize <= combined.length) {
                const chunk = combined.subarray(offset, offset + chunkSize);
                const mp3buf = mp3Encoder.encodeBuffer(chunk);
                if (mp3buf.length > 0) {
                    mp3Chunks.push(mp3buf);
                }
                offset += chunkSize;
            }

            // Save leftover unencoded PCM samples
            pcmBuffer = combined.subarray(offset);
        }

        function releaseAudioResources() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            if (sourceNode) {
                sourceNode.disconnect();
                sourceNode = null;
            }
            if (workletNode) {
                workletNode.disconnect();
                workletNode.port.onmessage = null;
                workletNode = null;
            }
            if (analyserNode) {
                analyserNode.disconnect();
                analyserNode = null;
            }
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
                audioCtx = null;
            }
            activeDeviceId = null;
            mp3Encoder = null;
        }

        function setState(newState) {
            currentState = newState;
            
            elBtnStart.style.display = 'none';
            elBtnPause.style.display = 'none';
            elBtnResume.style.display = 'none';
            elBtnStop.style.display = 'none';
            elBtnDownloadManual.style.display = 'none';

            // Reset status badge graphics
            elStatusDot.className = "w-2 h-2 rounded-full";
            
            switch (newState) {
                case STATE.IDLE:
                    elName.disabled = false;
                    micCustomSelect.classList.remove('form-control-disabled');
                    bitrateCustomSelect.classList.remove('form-control-disabled');

                    elBtnStart.disabled = false;
                    elBtnStart.style.display = 'flex';

                    elStatusDot.classList.add("bg-slate-500");
                    elStatusText.textContent = "就绪";
                    break;

                case STATE.RECORDING:
                    elName.disabled = true;
                    micCustomSelect.classList.remove('form-control-disabled'); 
                    bitrateCustomSelect.classList.add('form-control-disabled');

                    elBtnPause.disabled = false;
                    elBtnPause.style.display = 'flex';
                    elBtnStop.disabled = false;
                    elBtnStop.style.display = 'flex';

                    elStatusDot.classList.add("bg-red-500", "recording-pulse");
                    elStatusText.textContent = "正在录音";
                    break;

                case STATE.PAUSED:
                    elName.disabled = true;
                    micCustomSelect.classList.remove('form-control-disabled'); 
                    bitrateCustomSelect.classList.add('form-control-disabled');

                    elBtnResume.disabled = false;
                    elBtnResume.style.display = 'flex';
                    elBtnStop.disabled = false;
                    elBtnStop.style.display = 'flex';

                    elStatusDot.classList.add("bg-amber-500");
                    elStatusText.textContent = "已暂停";
                    break;

                case STATE.ENCODING:
                    elName.disabled = true;
                    micCustomSelect.classList.add('form-control-disabled');
                    bitrateCustomSelect.classList.add('form-control-disabled');

                    elStatusDot.classList.add("bg-blue-500", "animate-ping");
                    elStatusText.textContent = "打包中...";
                    break;

                case STATE.FINISHED:
                    elName.disabled = false;
                    micCustomSelect.classList.remove('form-control-disabled');
                    bitrateCustomSelect.classList.remove('form-control-disabled');

                    elBtnStart.disabled = false;
                    elBtnStart.style.display = 'flex';
                    elBtnDownloadManual.disabled = false;
                    elBtnDownloadManual.style.display = 'flex';

                    elStatusDot.classList.add("bg-emerald-500");
                    elStatusText.textContent = "完成";
                    break;
            }
        }

        // Action Handlers
        elBtnStart.addEventListener('click', async () => {
            showToast("");
            elPlayerContainer.style.display = 'none';

            if (typeof lamejs === 'undefined') {
                showToast("⚠ lamejs 编码库未能加载，请检查网络连接。");
                return;
            }

            // Initialize MP3 Encoder
            const kbps = parseInt(selectedBitrateVal, 10);
            mp3Encoder = new lamejs.Mp3Encoder(1, TARGET_SAMPLE_RATE, kbps);
            mp3Chunks = [];
            pcmBuffer = new Int16Array(0);

            totalRecordedMs = 0;
            updateTimerDisplay(0);

            const ok = await switchMicStream(activeDeviceId);

            if (!ok || !currentStream) {
                showToast("⚠ 无法开启麦克风。");
                return;
            }

            recordStartTime = new Date();
            startTimer();
            setState(STATE.RECORDING);
        });

        elBtnPause.addEventListener('click', () => {
            pauseTimer();
            setState(STATE.PAUSED);
        });

        elBtnResume.addEventListener('click', async () => {
            showToast("");

            let isStreamValid = false;
            if (currentStream && currentStream.getAudioTracks().length > 0) {
                const track = currentStream.getAudioTracks()[0];
                if (track && track.readyState === 'live') {
                    isStreamValid = true;
                }
            }

            if (!isStreamValid) {
                const reconnected = await switchMicStream(activeDeviceId);
                if (!reconnected) {
                    showToast("⚠ 麦克风重连失败。");
                    setState(STATE.PAUSED);
                    return;
                }
            }

            startTimer();
            setState(STATE.RECORDING);
        });

        elBtnStop.addEventListener('click', async () => {
            pauseTimer();
            setState(STATE.ENCODING);

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            if (sourceNode) {
                sourceNode.disconnect();
                sourceNode = null;
            }

            setTimeout(async () => {
                await finalizeAndDownloadMP3();
            }, 100);
        });

        elBtnDownloadManual.addEventListener('click', () => {
            if (currentDownloadUrl && currentFileName) {
                triggerDownload(currentDownloadUrl, currentFileName);
            }
        });

        function sanitizeFileName(rawName) {
            if (!rawName) return '录音';
            let sanitized = rawName.replace(/[\\/:*?"<>|]/g, '_');
            sanitized = sanitized.trim().replace(/\s+/g, ' ');
            return sanitized || '录音';
        }

        function generateFileName(startTime, customName) {
            const pad = (n) => n.toString().padStart(2, '0');
            const year = startTime.getFullYear();
            const month = pad(startTime.getMonth() + 1);
            const day = pad(startTime.getDate());
            const hours = pad(startTime.getHours());
            const minutes = pad(startTime.getMinutes());
            const seconds = pad(startTime.getSeconds());

            const safeName = sanitizeFileName(customName);
            return `${safeName}_${year}-${month}-${day}_${hours}-${minutes}-${seconds}.mp3`;
        }

        async function finalizeAndDownloadMP3() {
            try {
                if (!mp3Encoder) throw new Error("编码组件未激活");

                showToast("正在导出 MP3 文件...");

                // Flush remaining PCM buffer
                if (pcmBuffer.length > 0) {
                    const mp3buf = mp3Encoder.encodeBuffer(pcmBuffer);
                    if (mp3buf.length > 0) mp3Chunks.push(mp3buf);
                    pcmBuffer = new Int16Array(0);
                }

                // Finalize MP3 frame stream
                const endBuf = mp3Encoder.flush();
                if (endBuf.length > 0) mp3Chunks.push(endBuf);

                if (mp3Chunks.length === 0) throw new Error("无有效音频数据录入");

                const blob = new Blob(mp3Chunks, { type: 'audio/mp3' });

                if (currentDownloadUrl) URL.revokeObjectURL(currentDownloadUrl);
                currentDownloadUrl = URL.createObjectURL(blob);
                currentFileName = generateFileName(recordStartTime || new Date(), elName.value);

                triggerDownload(currentDownloadUrl, currentFileName);
                elAudioPreview.src = currentDownloadUrl;
                elPlayerContainer.style.display = 'flex';

                mp3Chunks = [];
                mp3Encoder = null;

                showToast("");
                setState(STATE.FINISHED);
            } catch(err) {
                console.error("MP3 导出失败:", err);
                mp3Chunks = [];
                mp3Encoder = null;
                showToast("⚠ " + err.message);
                setState(STATE.IDLE);
            }
        }

        function triggerDownload(url, fileName) {
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = fileName;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        function startTimer() {
            lastTimerTick = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                totalRecordedMs += (now - lastTimerTick);
                lastTimerTick = now;
                updateTimerDisplay(totalRecordedMs);
            }, 100);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay(ms) {
            const totalSec = Math.floor(ms / 1000);
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            const seconds = totalSec % 60;

            const pad = (n) => n.toString().padStart(2, '0');
            elTimer.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        // Visualizer drawing routine
        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            const rectWidth = canvas.getBoundingClientRect().width;
            const rectHeight = canvas.getBoundingClientRect().height;

            ctx.clearRect(0, 0, rectWidth, rectHeight);

            if (analyserNode && currentState === STATE.RECORDING) {
                analyserNode.getByteFrequencyData(globalFreqData);
            }

            const totalBars = CANVAS_BARS;
            const totalSegs = CANVAS_SEGS;
            const gapX = 4;
            const barWidth = (rectWidth - (totalBars - 1) * gapX) / totalBars;
            const segGapY = 1.5;
            const segHeight = (rectHeight - (totalSegs - 1) * segGapY) / totalSegs;

            for (let i = 0; i < totalBars; i++) {
                let targetSegCount = 0;

                if (currentState === STATE.RECORDING) {
                    const fftIdx = Math.floor(Math.pow(i / totalBars, 1.5) * 60) + 1;
                    const rawVal = globalFreqData[fftIdx] || 0;
                    targetSegCount = (rawVal / 255) * totalSegs;
                } else if (currentState === STATE.PAUSED) {
                    targetSegCount = barHeights[i];
                } else if (currentState === STATE.IDLE) {
                    targetSegCount = 1;
                } else if (currentState === STATE.ENCODING || currentState === STATE.FINISHED) {
                    targetSegCount = 0;
                }

                if (targetSegCount > barHeights[i]) {
                    barHeights[i] += (targetSegCount - barHeights[i]) * 0.8;
                } else {
                    barHeights[i] -= (barHeights[i] - targetSegCount) * 0.15;
                }

                const currentActiveSegs = Math.round(barHeights[i]);

                for (let s = 0; s < totalSegs; s++) {
                    const segIdxFromBottom = s;
                    const x = i * (barWidth + gapX);
                    const y = rectHeight - (segIdxFromBottom + 1) * segHeight - segIdxFromBottom * segGapY;

                    const isActive = segIdxFromBottom < currentActiveSegs;

                    if (isActive) {
                        if (segIdxFromBottom >= 6) {
                            ctx.fillStyle = '#ef4444'; // Red high frequency
                        } else if (segIdxFromBottom >= 4) {
                            ctx.fillStyle = '#f59e0b'; // Amber mid frequency
                        } else {
                            ctx.fillStyle = '#3b82f6'; // Blue low frequency
                        }
                    } else {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    }

                    drawRoundedRect(ctx, x, y, barWidth, segHeight, 1.5);
                }
            }
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y + w, x, y, r);
            ctx.closePath();
            ctx.fill();
        }

        function showToast(msg) {
            elToast.textContent = msg;
        }
    </script>
